# Automatic Analysis (no CI sonar-scanner in this repo).
# archive/: frozen maintainer notebooks / kaggle kernels, not active training code.
# vendor/: third-party CBraMod sources kept verbatim.
sonar.exclusions=archive/**,vendor/**

# Historical near-clone ingest scripts: leftover 1-line new dups sit inside
# already-duplicated main loops (stamp_manifest_and_copy). Exclude from CPD
# so the new-duplication quality gate measures active library code.
sonar.cpd.exclusions=scripts/expand_attention_*.py,scripts/more_ds*_subjects.py
